<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">Bloxchain composable framework</title>
  <desc id="desc">EngineBlox state machine composes into BaseStateMachine and optional SecureOwnable, RuntimeRBAC, and GuardController, culminating in the Account pattern flagship with example applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="340" rx="12" fill="url(#bg)" stroke="#cbd5e1"/>
  <text x="460" y="34" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Compose secure Ethereum applications</text>
  <text x="460" y="54" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">EngineBlox state abstraction ’ optional core components ’ Account (flagship)</text>

  <!-- EngineBlox -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="130" height="56" rx="8" fill="#312e81" stroke="#4338ca"/>
    <text x="105" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff">EngineBlox</text>
    <text x="105" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#c7d2fe">state machine</text>
  </g>

  <!-- BaseStateMachine -->
  <g filter="url(#shadow)">
    <rect x="220" y="110" width="150" height="56" rx="8" fill="#1e40af" stroke="#2563eb"/>
    <text x="295" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff">BaseStateMachine</text>
    <text x="295" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#bfdbfe">shared engine hook</text>
  </g>

  <!-- Optional components -->
  <g filter="url(#shadow)">
    <rect x="420" y="78" width="130" height="44" rx="8" fill="#0f766e" stroke="#14b8a6"/>
    <text x="485" y="105" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">SecureOwnable</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="420" y="132" width="130" height="44" rx="8" fill="#0f766e" stroke="#14b8a6"/>
    <text x="485" y="159" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">RuntimeRBAC</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="420" y="186" width="130" height="44" rx="8" fill="#0f766e" stroke="#14b8a6"/>
    <text x="485" y="213" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">GuardController</text>
  </g>
  <text x="485" y="248" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#64748b">optional  pick what you need</text>

  <!-- Account flagship -->
  <g filter="url(#shadow)">
    <rect x="600" y="110" width="130" height="56" rx="8" fill="#7c2d12" stroke="#ea580c"/>
    <text x="665" y="134" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff">Account</text>
    <text x="665" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#fed7aa">flagship pattern</text>
  </g>

  <!-- Example callouts -->
  <g filter="url(#shadow)">
    <rect x="760" y="88" width="130" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="825" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#334155">SimpleVault · PayBlox</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="132" width="130" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="825" y="154" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#334155">CopyBlox · GuardianSafe</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="176" width="130" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="825" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#334155">AccountBlox</text>
  </g>
  <text x="825" y="232" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#64748b">contracts/examples/</text>

  <!-- Arrows -->
  <line x1="170" y1="138" x2="218" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="138" x2="418" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="100" x2="598" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="138" x2="598" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="176" x2="598" y2="151" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="138" x2="758" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <rect x="40" y="280" width="840" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="460" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#334155">Audited core framework · Sepolia official deployments · mainnet coming soon</text>
</svg>
