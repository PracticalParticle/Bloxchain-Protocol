<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Bloxchain composable framework</title>
  <desc id="desc">EngineBlox state machine composes into BaseStateMachine and optional SecureOwnable, RuntimeRBAC, and GuardController, culminating in the Account pattern with example applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <filter id="accGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="360" rx="12" fill="url(#bg)" stroke="#cbd5e1"/>

  <!-- Logo slot (replace with embedded image or swap SVG when brand asset ships) -->
  <rect x="24" y="16" width="52" height="52" rx="8" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="50" y="48" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#94a3b8">logo</text>

  <text x="480" y="38" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Compose secure Ethereum applications</text>
  <text x="480" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748b">EngineBlox state abstraction · optional components · Account pattern</text>

  <!-- EngineBlox -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="130" height="56" rx="8" fill="#312e81" stroke="#4338ca"/>
    <text x="105" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff">EngineBlox</text>
    <text x="105" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#c7d2fe">state machine</text>
  </g>

  <!-- BaseStateMachine -->
  <g filter="url(#shadow)">
    <rect x="210" y="120" width="150" height="56" rx="8" fill="#1e40af" stroke="#2563eb"/>
    <text x="285" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff">BaseStateMachine</text>
    <text x="285" y="162" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#bfdbfe">shared engine hook</text>
  </g>

  <!-- Optional components -->
  <g filter="url(#shadow)">
    <rect x="400" y="88" width="130" height="44" rx="8" fill="#0f766e" stroke="#14b8a6"/>
    <text x="465" y="115" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">SecureOwnable</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="400" y="142" width="130" height="44" rx="8" fill="#0f766e" stroke="#14b8a6"/>
    <text x="465" y="169" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">RuntimeRBAC</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="400" y="196" width="130" height="44" rx="8" fill="#0f766e" stroke="#14b8a6"/>
    <text x="465" y="223" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">GuardController</text>
  </g>
  <text x="465" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#64748b">optional — pick what you need</text>

  <!-- Account (full composition — visual emphasis) -->
  <g filter="url(#accGlow)">
    <rect x="580" y="108" width="150" height="72" rx="10" fill="#7c2d12" stroke="#ea580c" stroke-width="2"/>
    <text x="655" y="136" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff">Account</text>
    <text x="655" y="154" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#fed7aa">pattern</text>
    <text x="655" y="170" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#ffedd5">full composition</text>
  </g>

  <!-- Example callouts -->
  <g filter="url(#shadow)">
    <rect x="760" y="98" width="130" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="825" y="120" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#334155">AccountBlox</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="142" width="130" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="825" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#334155">SimpleVault · PayBlox</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="186" width="130" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="825" y="208" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#334155">CopyBlox · GuardianSafe</text>
  </g>
  <text x="825" y="242" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#64748b">contracts/examples/</text>

  <!-- Arrows -->
  <line x1="170" y1="148" x2="208" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="148" x2="398" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="110" x2="578" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="148" x2="578" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="186" x2="578" y2="166" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="148" x2="758" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <rect x="40" y="300" width="840" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="460" y="325" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#334155">Audited core framework · Sepolia official deployments · mainnet coming soon</text>
</svg>
