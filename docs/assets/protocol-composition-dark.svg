<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" role="img" aria-labelledby="title desc">
  <title id="title">How Bloxchain Protocol fits together</title>
  <desc id="desc">EngineBlox into BaseStateMachine; optional SecureOwnable, RuntimeRBAC, and GuardController compose into Account. Examples: vaults, payments, tokens, factories, Safe integrations.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141A"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#252A33" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#12141A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="16" y="12" width="888" height="556" rx="20" fill="url(#plate)"/>
  <rect x="16" y="12" width="888" height="556" rx="20" fill="url(#glow)"/>

