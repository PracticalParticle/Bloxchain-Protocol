<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-labelledby="title desc">
  <title id="title">How Bloxchain Protocol fits together</title>
  <desc id="desc">Modular on-chain governance stack: EngineBlox into BaseStateMachine; optional SecureOwnable, RuntimeRBAC, and GuardController compose into Account; examples include vaults, payments, tokens, factories, and Safe integrations.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141A"/>
      <stop offset="100%" stop-color="#1A1D24"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="8%" r="58%">
      <stop offset="0%" stop-color="#2A3140" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#12141A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="16" y="12" width="888" height="616" rx="20" fill="url(#plate)"/>
  <rect x="16" y="12" width="888" height="616" rx="20" fill="url(#glow)"/>

  <!-- Header: solid brand badge + title (reference layout) -->
  <g transform="translate(40 32)">
    <rect width="36" height="36" rx="8" fill="#0A0A0A" stroke="#FAFAFA" stroke-width="1.25"/>
    <g fill="#FAFAFA" transform="translate(5.5 5.2) scale(0.78)">
      <path d="M3.22905 26.5455V4.72727H7.59268V6.02273H4.67791V25.25H7.59268V26.5455H3.22905Z"/>
      <path d="M28.7688 4.72727V26.5455H24.4052V25.25H27.32V6.02273H24.4052V4.72727H28.7688Z"/>
      <path d="M7.24228 23V9.90909H12.4838C13.4468 9.90909 14.2501 10.0518 14.8936 10.3374C15.537 10.6229 16.0207 11.0192 16.3445 11.5263C16.6684 12.0291 16.8303 12.6087 16.8303 13.2649C16.8303 13.7763 16.7281 14.2259 16.5235 14.6136C16.319 14.9972 16.0377 15.3125 15.6798 15.5597C15.3261 15.8026 14.9213 15.9751 14.4653 16.0774V16.2053C14.9639 16.2266 15.4305 16.3672 15.8651 16.6271C16.3041 16.8871 16.6599 17.2514 16.9326 17.7202C17.2053 18.1847 17.3417 18.7386 17.3417 19.3821C17.3417 20.0767 17.1691 20.6967 16.824 21.2422C16.483 21.7834 15.9781 22.2116 15.309 22.527C14.64 22.8423 13.8154 23 12.8353 23H7.24228ZM10.01 20.7372H12.2664C13.0377 20.7372 13.6002 20.5902 13.9539 20.2962C14.3076 19.9979 14.4845 19.6016 14.4845 19.1072C14.4845 18.745 14.3971 18.4254 14.2224 18.1484C14.0477 17.8714 13.7984 17.6541 13.4745 17.4964C13.1549 17.3388 12.7735 17.2599 12.3303 17.2599H10.01V20.7372ZM10.01 15.3871H12.0619C12.4411 15.3871 12.7778 15.321 13.0718 15.1889C13.3701 15.0526 13.6045 14.8608 13.7749 14.6136C13.9497 14.3665 14.037 14.0703 14.037 13.7251C14.037 13.2521 13.8687 12.8707 13.532 12.581C13.1997 12.2912 12.7267 12.1463 12.113 12.1463H10.01V15.3871ZM20.2464 16.4545L21.4481 18.7429L22.6796 16.4545H24.5418L22.6455 19.7273L24.593 23H22.7393L21.4481 20.7372L20.1782 23H18.3032L20.2464 19.7273L18.3714 16.4545H20.2464Z"/>
    </g>
  </g>
  <text x="92" y="48" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#FAFAFA">How the protocol fits together</text>
  <text x="92" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#B3B8C2">A modular, on-chain governance stack. Compose only the pieces you need.</text>

  <!-- EngineBlox -->
  <g filter="url(#soft)">
    <rect x="250" y="96" width="280" height="56" rx="12" fill="#FAFAFA"/>
  </g>
  <!-- cubes icon -->
  <g stroke="#0A0A0A" stroke-width="1.2" fill="none" transform="translate(268 112)">
    <rect x="2" y="10" width="10" height="10" rx="1.5"/>
    <rect x="10" y="4" width="10" height="10" rx="1.5"/>
    <rect x="18" y="10" width="10" height="10" rx="1.5"/>
  </g>
  <text x="310" y="120" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0A0A0A">EngineBlox</text>
  <text x="310" y="138" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#525252">Shared rules engine</text>
  <text x="548" y="122" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8B919A">Validates actions against your</text>
  <text x="548" y="138" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8B919A">rules and policies.</text>

  <line x1="390" y1="152" x2="390" y2="178" stroke="#6B7280" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- BaseStateMachine -->
  <g filter="url(#soft)">
    <rect x="250" y="184" width="280" height="56" rx="12" fill="#1C1F26" stroke="#2E3440" stroke-width="1.25"/>
  </g>
  <g stroke="#B3B8C2" stroke-width="1.2" fill="none" transform="translate(268 200)">
    <ellipse cx="14" cy="6" rx="12" ry="4"/>
    <path d="M2 6 v12 c0 2.2 5.4 4 12 4 s12 -1.8 12 -4 V6"/>
    <path d="M2 12 c0 2.2 5.4 4 12 4 s12 -1.8 12 -4"/>
  </g>
  <text x="310" y="208" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FAFAFA">BaseStateMachine</text>
  <text x="310" y="226" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#B3B8C2">Holds the on-chain state</text>
  <text x="548" y="210" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8B919A">Single source of truth for accounts,</text>
  <text x="548" y="226" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8B919A">policies and state.</text>

  <line x1="390" y1="240" x2="390" y2="268" stroke="#6B7280" stroke-width="1.25"/>
  <line x1="140" y1="268" x2="640" y2="268" stroke="#6B7280" stroke-width="1.25"/>
  <line x1="140" y1="268" x2="140" y2="292" stroke="#6B7280" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="390" y1="268" x2="390" y2="292" stroke="#6B7280" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="640" y1="268" x2="640" y2="292" stroke="#6B7280" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- Optional siblings -->
  <g filter="url(#soft)">
    <rect x="56" y="298" width="168" height="58" rx="12" fill="#1C1F26" stroke="#2E3440" stroke-width="1.1"/>
  </g>
  <g stroke="#B3B8C2" stroke-width="1.2" fill="none" transform="translate(70 314)">
    <path d="M8 20 l8 -16 8 16 Z"/>
    <path d="M12 14 h8"/>
  </g>
  <text x="104" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FAFAFA">SecureOwnable</text>
  <text x="104" y="340" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#B3B8C2">Ownership &amp; waiting periods</text>
  <text x="56" y="376" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8B919A">Enforces ownership rules,</text>
  <text x="56" y="390" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8B919A">transfers and delay periods.</text>

  <g filter="url(#soft)">
    <rect x="306" y="298" width="168" height="58" rx="12" fill="#1C1F26" stroke="#2E3440" stroke-width="1.1"/>
  </g>
  <g stroke="#B3B8C2" stroke-width="1.2" fill="none" transform="translate(320 314)">
    <circle cx="10" cy="8" r="4"/>
    <path d="M2 20 c0 -4.4 3.6 -8 8 -8 s8 3.6 8 8"/>
    <circle cx="22" cy="8" r="3.5"/>
    <path d="M16 20 c1 -3.2 3.6 -5.5 7 -5.5"/>
  </g>
  <text x="354" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FAFAFA">RuntimeRBAC</text>
  <text x="354" y="340" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#B3B8C2">Roles &amp; permissions</text>
  <text x="306" y="376" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8B919A">Manages roles and permissions</text>
  <text x="306" y="390" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8B919A">for accounts and actions.</text>

  <g filter="url(#soft)">
    <rect x="556" y="298" width="168" height="58" rx="12" fill="#1C1F26" stroke="#2E3440" stroke-width="1.1"/>
  </g>
  <g stroke="#B3B8C2" stroke-width="1.2" fill="none" transform="translate(570 314)">
    <rect x="6" y="10" width="16" height="12" rx="2"/>
    <path d="M10 10 V8 a4 4 0 0 1 8 0 v2"/>
  </g>
  <text x="604" y="322" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FAFAFA">GuardController</text>
  <text x="604" y="340" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#B3B8C2">Guarded external calls</text>
  <text x="556" y="376" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8B919A">Applies guards to external calls</text>
  <text x="556" y="390" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8B919A">and protocol interactions.</text>

  <rect x="744" y="310" width="118" height="34" rx="8" fill="none" stroke="#4B5563" stroke-width="1.1" stroke-dasharray="3.5 3"/>
  <text x="803" y="331" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#8B919A">Optional subset OK</text>

  <line x1="140" y1="400" x2="140" y2="430" stroke="#6B7280" stroke-width="1.25"/>
  <line x1="390" y1="400" x2="390" y2="430" stroke="#6B7280" stroke-width="1.25"/>
  <line x1="640" y1="400" x2="640" y2="430" stroke="#6B7280" stroke-width="1.25"/>
  <line x1="140" y1="430" x2="640" y2="430" stroke="#6B7280" stroke-width="1.25"/>
  <line x1="390" y1="430" x2="390" y2="454" stroke="#6B7280" stroke-width="1.25" marker-end="url(#arrow)"/>

  <!-- Account (emphasis) -->
  <g filter="url(#soft)">
    <rect x="250" y="460" width="280" height="56" rx="12" fill="#FAFAFA"/>
  </g>
  <g stroke="#0A0A0A" stroke-width="1.3" fill="none" transform="translate(268 474)">
    <circle cx="14" cy="10" r="5"/>
    <path d="M4 28 c0 -6 4.5 -10 10 -10 s10 4 10 10"/>
  </g>
  <text x="310" y="484" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0A0A0A">Account</text>
  <text x="310" y="502" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#525252">Full governed account</text>
  <text x="548" y="486" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8B919A">The resulting smart account,</text>
  <text x="548" y="502" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8B919A">governed by your configuration.</text>

  <!-- Footer -->
  <line x1="48" y1="546" x2="872" y2="546" stroke="#2E3440" stroke-width="1" stroke-dasharray="4 4"/>
  <g stroke="#B3B8C2" stroke-width="1.1" fill="none" transform="translate(48 562)">
    <rect x="2" y="6" width="10" height="10" rx="1.2"/>
    <rect x="10" y="2" width="10" height="10" rx="1.2"/>
    <rect x="18" y="6" width="10" height="10" rx="1.2"/>
  </g>
  <text x="88" y="580" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#FAFAFA">Built for everything on-chain</text>
  <line x1="292" y1="562" x2="292" y2="590" stroke="#2E3440" stroke-width="1"/>

  <!-- Example chips -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#B3B8C2">
    <g transform="translate(312 566)">
      <circle cx="6" cy="8" r="5.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <path d="M3.5 8 l2 2 3.5 -3.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <text x="16" y="12">Vaults</text>
    </g>
    <g transform="translate(388 566)">
      <circle cx="6" cy="8" r="5.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <path d="M3.5 8 l2 2 3.5 -3.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <text x="16" y="12">Payments</text>
    </g>
    <g transform="translate(486 566)">
      <circle cx="6" cy="8" r="5.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <path d="M3.5 8 l2 2 3.5 -3.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <text x="16" y="12">Tokens</text>
    </g>
    <g transform="translate(562 566)">
      <circle cx="6" cy="8" r="5.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <path d="M3.5 8 l2 2 3.5 -3.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <text x="16" y="12">Factories</text>
    </g>
    <g transform="translate(656 566)">
      <circle cx="6" cy="8" r="5.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <path d="M3.5 8 l2 2 3.5 -3.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <text x="16" y="12">Safe integrations</text>
    </g>
    <text x="800" y="578" fill="#8B919A">and more</text>
  </g>
</svg>
