    </g>
    <g transform="translate(388 522)">
      <circle cx="6" cy="8" r="5.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <path d="M3.5 8 l2 2 3.5 -3.5" fill="none" stroke="#6B7280" stroke-width="1.1"/>
      <text x="16" y="12">Payments</text>
    </g>
    <g transform="translate(486 522)">
