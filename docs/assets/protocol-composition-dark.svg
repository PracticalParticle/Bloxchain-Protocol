  <text x="688" y="322" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#B3B8C2">Guarded external calls</text>
  <text x="750" y="358" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8B919A">Policy on outbound calls</text>

