<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" role="img" aria-labelledby="title desc">
  <title id="title">How Bloxchain Protocol fits together</title>
  <desc id="desc">Shared rules engine into on-chain state base; optional ownership, roles, and guarded calls compose into a full governed account; example applications teams build.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F5F7"/>
      <stop offset="100%" stop-color="#E8EAEE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#E5E7EB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F4F5F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect x="20" y="12" width="880" height="506" rx="20" fill="url(#plate)"/>
  <rect x="20" y="12" width="880" height="506" rx="20" fill="url(#glow)"/>

  <text x="460" y="44" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0A0A0A">How the protocol fits together</text>
  <text x="460" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#525252">Compose only the pieces you need</text>

  <g filter="url(#soft)">
    <rect x="345" y="88" width="230" height="52" rx="10" fill="#0A0A0A"/>
  </g>
  <text x="460" y="110" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">EngineBlox</text>
  <text x="460" y="128" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#737373">Shared rules engine</text>

  <line x1="460" y1="140" x2="460" y2="182" stroke="#9CA3AF" stroke-width="1.25" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="330" y="188" width="260" height="52" rx="10" fill="#FFFFFF" stroke="#D8DBE0" stroke-width="1.25"/>
  </g>
  <text x="460" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0A0A0A">BaseStateMachine</text>
  <text x="460" y="228" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#525252">Holds the on-chain state</text>

  <line x1="460" y1="240" x2="460" y2="266" stroke="#9CA3AF" stroke-width="1.25"/>
  <line x1="200" y1="266" x2="720" y2="266" stroke="#9CA3AF" stroke-width="1.25"/>
  <line x1="200" y1="266" x2="200" y2="294" stroke="#9CA3AF" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="460" y1="266" x2="460" y2="294" stroke="#9CA3AF" stroke-width="1.25" marker-end="url(#arrow)"/>
  <line x1="720" y1="266" x2="720" y2="294" stroke="#9CA3AF" stroke-width="1.25" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="120" y="300" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#D8DBE0" stroke-width="1.1"/>
  </g>
  <text x="200" y="322" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0A0A0A">SecureOwnable</text>
  <text x="200" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#525252">Ownership &amp; waiting periods</text>

  <g filter="url(#soft)">
    <rect x="380" y="300" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#D8DBE0" stroke-width="1.1"/>
  </g>
  <text x="460" y="322" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0A0A0A">RuntimeRBAC</text>
  <text x="460" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#525252">Roles &amp; permissions</text>

  <g filter="url(#soft)">
    <rect x="640" y="300" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#D8DBE0" stroke-width="1.1"/>
  </g>
  <text x="720" y="322" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0A0A0A">GuardController</text>
  <text x="720" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#525252">Guarded external calls</text>

  <text x="812" y="324" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#737373">Optional</text>
  <text x="812" y="338" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#737373">subset OK</text>

  <line x1="200" y1="356" x2="200" y2="386" stroke="#9CA3AF" stroke-width="1.25"/>
  <line x1="460" y1="356" x2="460" y2="386" stroke="#9CA3AF" stroke-width="1.25"/>
  <line x1="720" y1="356" x2="720" y2="386" stroke="#9CA3AF" stroke-width="1.25"/>
  <line x1="200" y1="386" x2="720" y2="386" stroke="#9CA3AF" stroke-width="1.25"/>
  <line x1="460" y1="386" x2="460" y2="410" stroke="#9CA3AF" stroke-width="1.25" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="345" y="416" width="230" height="52" rx="10" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
  </g>
  <text x="460" y="438" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0A0A0A">Account</text>
  <text x="460" y="456" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#525252">Full governed account</text>

  <text x="460" y="500" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#525252">Examples: vaults, payments, tokens, factories, Safe integrations</text>
</svg>
