# Dependabot opens PRs against dev so they follow the dev -> main flow
# required by .github/workflows/require-dev-to-main.yml
version: 2
updates:
  # Keep immutable GitHub Action pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"

  # Root workspace / tooling
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      npm_and_yarn:
        patterns:
          - "*"

  # Doc generation utilities
  - package-ecosystem: "npm"
    directory: "/docgen"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    ignore:
      # docgen intentionally remains on the isolated Hardhat 2.x toolchain.
      - dependency-name: "hardhat"
        update-types:
          - "version-update:semver-major"

  # Published contract package
  - package-ecosystem: "npm"
    directory: "/package"
    schedule:
      interval: "weekly"
    target-branch: "dev"

  # TypeScript SDK package
  - package-ecosystem: "npm"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
    target-branch: "dev"
