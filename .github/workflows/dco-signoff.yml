# Validates Developer Certificate of Origin (Signed-off-by) on every commit in a PR.
# Mark this check as required under branch protection: "DCO / Signed-off-by"
name: DCO Sign-off

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  dco:
    name: DCO / Signed-off-by
    runs-on: ubuntu-latest
    # Dependabot commits are not signed with -s unless configured separately.
    # Release Please bot commits (chore: release) likewise lack Signed-off-by;
    # those branches are an allowed release path onto main (see require-dev-to-main).
    if: >
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release-please--branches--')
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch pull request base and main
        run: |
          git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}
          # Commits already on main (e.g. release-please) must not fail DCO when
          # syncing main into another branch; only new contribution commits count.
          git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify Signed-off-by on all commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Exclude merge commits and anything already reachable from main.
          commits=$(git rev-list --no-merges "${BASE_SHA}".."${HEAD_SHA}" --not origin/main)
          if [ -z "${commits}" ]; then
            echo "No new non-merge commits to verify (merges / main history skipped)."
            exit 0
          fi

          failed=0
          for commit in ${commits}; do
            subject=$(git log -1 --format=%s "${commit}")
            if ! git log -1 --format=%B "${commit}" | grep -qE '^Signed-off-by: '; then
              echo "::error title=Missing DCO sign-off::${commit} — ${subject}"
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo ""
            echo "Every new commit in this pull request must include a DCO sign-off line, for example:"
            echo "  Signed-off-by: Your Name <you@example.com>"
            echo ""
            echo "Fix the latest commit:  git commit --amend -s --no-edit"
            echo "Fix all commits:        git rebase --signoff origin/${{ github.base_ref }}"
            echo "See CONTRIBUTING.md and DCO in the repository root."
            exit 1
          fi

          count=$(echo "${commits}" | wc -w | tr -d ' ')
          echo "DCO sign-off verified on ${count} commit(s)."
