name: Require dev as PR source to main

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure only dev (or Release Please) can target main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          # Normal path: all product work lands via dev → main.
          # Exception: Release Please opens release-please--branches--main → main
          # (see CONTRIBUTING.md Release Process). Dependabot targets dev instead.
          # Same-repo only: fork heads that reuse the release-please--branches--
          # prefix must not bypass this gate.
          if [ "$HEAD_REF" = "dev" ]; then
            echo "OK: PR source is 'dev'."
            exit 0
          fi
          case "$HEAD_REF" in
            release-please--branches--*)
              if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
                echo "OK: same-repo Release Please branch '$HEAD_REF' may target main."
                exit 0
              fi
              echo "::error::Release Please branch name from fork '$HEAD_REPO' is not allowed onto main. Only repository-owned release-please--branches--* heads may bypass the dev source rule."
              exit 1
              ;;
          esac
          echo "::error::Only the 'dev' branch (or a same-repo Release Please release branch) can be merged into main. This PR is from '$HEAD_REF'. Please open a PR from dev to main instead."
          exit 1
