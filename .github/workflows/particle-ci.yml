name: Particle CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Compile contracts
        run: npm run compile:foundry

      - name: Run Foundry tests
        run: npm run test:foundry

      - name: Install Slither
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install --user slither-analyzer==0.11.6

      - name: Run Slither
        if: github.event_name == 'workflow_dispatch'
        run: slither . --exclude-dependencies

      - name: Install Mythril
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 -m pip install mythril==0.24.8

      - name: Run Mythril
        if: github.event_name == 'workflow_dispatch'
        run: |
          find contracts -name "*.sol" -not -path "contracts/test/*" -not -path "contracts/mock/*" -exec myth analyze {} --execution-timeout 300 \;
