name: Particle CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1

      - name: Compile contracts
        run: npm run compile:foundry

      - name: Run Foundry tests
        run: npm run test:foundry

      - name: Setup Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install Slither and Mythril
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install slither-analyzer==0.11.6 mythril==0.24.8

      - name: Run Slither
        if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/slither . --exclude-dependencies

      - name: Run Mythril
        if: github.event_name == 'workflow_dispatch'
        run: |
          find contracts -name "*.sol" -not -path "contracts/test/*" -not -path "contracts/mock/*" -exec .venv/bin/myth analyze {} --execution-timeout 300 \;
